baseurl = "https://asduser.github.io"
title = "Another Software Developer"
theme = "roadster"
enableEmoji = true

#sectionPagesMenu = 'main'

# Configure Pagination. See https://gohugo.io/templates/pagination/#configuration
[pagination]
  pagerSize = 10 # (int) The number of pages per pager. Default is 10

[services]
  [services.googleAnalytics]
    id = 'G-MEASUREMENT_ID'  # Enable Google Analytics by entering your tracking id
  [services.disqus]
    shortname = 'your-disqus-shortname' # Enable Disqus by entering your Disqus shortname

[markup.goldmark.renderer]
  unsafe = true

[Params]
  description = "Network programming notes, performance tips and tricks, software security considerations"
  opengraph = true
  twitter_cards = true
  readmore = true
  authorbox = true
  pager = true
  post_meta = ["date", "categories"]
  mainSections = ["post", "docs", "pubs", "cv"]
  CustomHeadHTML = "" # Add custom HTML in the <head> 

[Params.author]
  name = "John Doe"
  bio = "John Doe's true identity is unknown. Maybe he is a successful blogger or writer. Nobody knows it."
  avatar = "img/avatar.png"

[Params.logo]
  subtitle = "Network programming, performance, security"

[Params.sidebar]
  home = "right"   # Configure layout for home page
  list = "right"   # Configure layout for list pages
  single = "right" # Configure layout for single pages
  # Enable widgets in given order
  widgets = ["info", "recent", "categories", "taglist"]

[Params.widgets]
  recent_num = 5 # Set the number of articles in the "Recent articles" widget
  tags_counter = false # Enable counter for each tag in "Tags" widget (disabled by default)

[markup]
  [markup.highlight]
    style = "gruvbox"

[menus]
  # [[menus.main]]
  #   name = 'Home'
  #   pageRef = '/'
  #   weight = 10
  [[menus.main]]
    name = 'Archive'
    pageRef = '/post'
    weight = 20
  [[menus.main]]
    name = 'Publications'
    pageRef = '/publications'
    weight = 30
  [[menus.main]]
    name = 'About'
    pageRef = '/about'
    weight = 40
